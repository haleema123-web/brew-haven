name: Brew Haven Playwright Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Vite dev server
        run: |
          npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          npx wait-on http://127.0.0.1:5173/brew-haven/ --timeout 90000
      - name: Run Playwright tests
        run: npx playwright test --update-snapshots
        env:
        CI: true

      - name: Show Vite logs (if tests fail)
        if: failure()
        run: cat vite.log

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-snapshots
          path: tests/**/*-snapshots/
          retention-days: 7