name: Brew Haven Playwright Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.1.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Vite dev server
        run: |
          npm run dev -- --host 127.0.0.1 > vite.log 2>&1 &
          npx wait-on http://127.0.0.1:5173/brew-haven/ --timeout 90000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Show Vite logs (if tests fail)
        if: failure()
        run: cat vite.log

      - name: Upload test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.4.3
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.4.3
        if: always()
        with:
          name: linux-snapshots
          path: tests/**/*-snapshots/
          retention-days: 7