name: 🚀 Deploy Brew Heaven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Code clone
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Python setup (backend testing ke liye)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      # 3. Backend dependencies install
      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install django

      # 4. Run migrations
      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate

      # 5. ⭐ HEADLESS TESTS
      - name: Run headless tests
        run: |
          cd backend
          python manage.py test

      # 6. Node setup (frontend build ke liye)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 7. Frontend dependencies install
      - name: Install frontend dependencies
        run: npm install

      # 8. Frontend build (Vite → dist folder banega)
      - name: Build frontend
        run: npm run build

      # 9. 🚀 DEPLOY frontend (dist folder) to GitHub Pages
      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      # 10. Success message
      - name: Deployment Status
        if: success()
        run: echo "✅ Brew Heaven deployed successfully!"

      # 11. Failure message
      - name: Deployment Status
        if: failure()
        run: echo "❌ Tests failed! Deployment stopped."